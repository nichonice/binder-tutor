<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Binder Tutor</title>
<style>
:root { --bg:#14161f; --card:#1e2130; --card2:#252a3d; --text:#e8e9ee; --muted:#8b8fa3; --accent:#c9a84c; --want:#4ccc6f; --lock:#e0774a; --line:#2a2e42; }
* { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; }
header { position:sticky; top:0; z-index:20; background:rgba(20,22,31,.97); border-bottom:1px solid var(--line); padding:12px 20px; }
.row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.brand { font-size:1.2rem; font-weight:600; }
nav { display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; }
nav button { background:var(--card); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:8px 14px; font-size:.88rem; cursor:pointer; }
nav button.on { border-color:var(--accent); color:var(--accent); }
input,select { background:var(--card); color:var(--text); border:1px solid #343850; border-radius:8px; padding:9px 12px; font-size:.9rem; }
input:focus,select:focus { outline:none; border-color:var(--accent); }
button.act { background:var(--card); color:var(--text); border:1px solid #343850; border-radius:8px; padding:9px 14px; cursor:pointer; font-size:.9rem; }
button.act:hover { border-color:var(--accent); }
button.primary { background:var(--accent); color:#1a1a1a; border:none; font-weight:600; }
.me { margin-left:auto; display:flex; align-items:center; gap:8px; font-size:.85rem; color:var(--muted); }
.me img { width:28px; height:28px; border-radius:50%; }
#cur { font-weight:700; min-width:52px; }
#view { padding:20px; }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:14px; }
.card { background:var(--card); border-radius:12px; overflow:hidden; border:1px solid var(--line); position:relative; }
.card img { width:100%; aspect-ratio:488/680; display:block; background:#0d0e14; }
.card.want { border-color:var(--want); }
.card.locked { opacity:.72; }
.info { padding:8px 10px; } .name { font-size:.85rem; font-weight:600; line-height:1.2; }
.meta { font-size:.72rem; color:var(--muted); margin-top:3px; }
.price { font-size:.8rem; font-weight:700; color:var(--accent); margin-top:4px; }
.badges { position:absolute; top:8px; left:8px; display:flex; gap:5px; flex-wrap:wrap; max-width:70%; }
.badge { font-size:.67rem; font-weight:700; padding:3px 7px; border-radius:20px; }
.qty { background:rgba(0,0,0,.75); color:#fff; } .foil { background:linear-gradient(90deg,#c9a84c,#e8d48b); color:#1a1a1a; }
.wantb { background:var(--want); color:#0c2214; }
.lockb { background:var(--lock); color:#241008; }
.listb { background:#5a6178; color:#e8e9ee; }
.heart { position:absolute; top:6px; right:6px; width:34px; height:34px; border-radius:50%; border:none; cursor:pointer;
  background:rgba(0,0,0,.6); color:#fff; font-size:1.05rem; display:flex; align-items:center; justify-content:center; }
.heart.on { background:var(--want); color:#0c2214; }
.matchbox { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:14px; }
.matchbox h2 { font-size:1rem; color:var(--want); margin-bottom:8px; }
.pair { font-size:.9rem; margin:5px 0; }
.pair.locked { color:var(--muted); }
.center { max-width:440px; margin:60px auto; text-align:center; }
.center p { color:var(--muted); margin:12px 0 20px; line-height:1.6; }
label { display:block; font-size:.8rem; color:var(--muted); margin:12px 0 4px; }
.field { max-width:520px; }
.hint { font-size:.8rem; color:var(--muted); margin-top:6px; line-height:1.5; }
#toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--card2); border:1px solid var(--accent);
  padding:10px 18px; border-radius:10px; font-size:.9rem; opacity:0; transition:opacity .2s; z-index:50; }
#toast.show { opacity:1; }
/* --- patch notes --- */
.dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--want); vertical-align:middle; margin-left:5px; }
#newbar { margin-top:10px; background:#1c3326; border:1px solid var(--want); border-radius:10px; padding:9px 14px;
  font-size:.87rem; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
#newbar b { color:var(--want); }
#newbar button { background:none; border:none; color:var(--muted); cursor:pointer; font-size:.87rem; text-decoration:underline; padding:0; }
.rel { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px 18px; margin-bottom:14px; max-width:720px; }
.rel.newest { border-color:var(--want); }
.rel h2 { font-size:1.05rem; margin-bottom:2px; }
.rel .when { font-size:.78rem; color:var(--muted); margin-bottom:10px; }
.rel .tag { font-size:.67rem; font-weight:700; padding:3px 8px; border-radius:20px; background:var(--want); color:#0c2214; margin-left:8px; vertical-align:middle; }
.rel ul { margin:0 0 0 18px; } .rel li { font-size:.9rem; line-height:1.55; margin:5px 0; }
.rel .todo { margin-top:12px; padding:10px 12px; background:var(--card2); border-radius:8px; font-size:.87rem; line-height:1.5; }
.rel .todo b { color:var(--accent); }
/* --- trading hub --- */
.hubrow { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:10px;
  max-width:720px; cursor:pointer; display:flex; gap:14px; align-items:center; }
.hubrow:hover { border-color:var(--accent); }
.hubrow .who { font-weight:600; flex:1; }
.hubrow .leg { font-size:.85rem; color:var(--muted); }
.hubrow .leg b { color:var(--text); font-weight:600; }
.hubrow .fit { font-size:.7rem; font-weight:700; padding:3px 9px; border-radius:20px; background:var(--want); color:#0c2214; }
.tcols { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:14px; max-width:900px; }
.tcol { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; }
.tcol h3 { font-size:.95rem; margin-bottom:2px; }
.tcol .sum { font-size:.8rem; color:var(--muted); margin-bottom:10px; }
.titem { display:flex; gap:9px; align-items:flex-start; padding:7px 0; border-top:1px solid var(--line); font-size:.87rem; }
.titem input { margin-top:3px; }
.titem .tn { flex:1; line-height:1.35; }
.titem .tm { font-size:.75rem; color:var(--muted); }
.titem .tp { font-weight:700; color:var(--accent); white-space:nowrap; }
.titem.off { opacity:.4; }
.thumb { width:46px; aspect-ratio:488/680; border-radius:4px; flex-shrink:0; cursor:zoom-in;
  background:#0d0e14; object-fit:cover; }
.thumb:hover { outline:2px solid var(--accent); }
.pair { display:flex; gap:10px; align-items:center; }
.pair .txt { flex:1; line-height:1.4; }
.titem .drop { background:none; border:none; color:var(--muted); cursor:pointer; font-size:.95rem; padding:0 2px; }
.titem .drop:hover { color:var(--lock); }
.bal { max-width:900px; background:var(--card2); border:1px solid var(--line); border-radius:12px;
  padding:14px 16px; margin-top:14px; display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
.bal .big { font-size:1.05rem; font-weight:600; }
.remind { max-width:900px; background:#33301c; border:1px solid var(--accent); border-radius:10px;
  padding:11px 14px; margin-top:12px; font-size:.87rem; line-height:1.5; }
.remind b { color:var(--accent); }
/* --- kortvisning (zoom) --- */
#lightbox { position:fixed; inset:0; background:rgba(8,9,14,.9); z-index:60;
  display:none; align-items:center; justify-content:center; padding:20px; }
#lightbox.on { display:flex; }
.lbbox { background:var(--card); border:1px solid var(--line); border-radius:16px; position:relative;
  max-width:1020px; width:100%; max-height:94vh; overflow:auto; padding:24px;
  display:grid; grid-template-columns:minmax(300px,420px) 1fr; gap:26px; }
.lbbox img { width:100%; border-radius:14px; display:block; background:#0d0e14; aspect-ratio:488/680;
  cursor:zoom-in; }
.lbclose { position:absolute; top:10px; right:12px; background:rgba(0,0,0,.5); color:#fff; border:none;
  width:36px; height:36px; border-radius:50%; font-size:1.1rem; cursor:pointer; z-index:2; }
.lbclose:hover { background:var(--lock); color:#241008; }
.lbimg { position:relative; }
.lbflip { position:absolute; bottom:10px; left:50%; transform:translateX(-50%);
  background:rgba(0,0,0,.72); color:#fff; border:1px solid #4a4f66; border-radius:20px;
  padding:7px 14px; font-size:.82rem; cursor:pointer; }
.lbh1 { font-size:1.25rem; font-weight:600; line-height:1.25; }
.lbmana { font-size:.9rem; color:var(--muted); margin-top:2px; }
.lbtype { font-size:.92rem; margin:12px 0 8px; padding-bottom:8px; border-bottom:1px solid var(--line); }
.lbtext { font-size:.9rem; line-height:1.6; white-space:pre-wrap; color:#d2d4de; }
.lbrows { margin-top:14px; font-size:.85rem; }
.lbrows div { display:flex; gap:10px; padding:5px 0; border-top:1px solid var(--line); }
.lbrows span:first-child { color:var(--muted); min-width:96px; }
.lbacts { margin-top:16px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.lbnav { display:flex; gap:6px; margin-left:auto; }
@media (max-width:640px) {
  #lightbox { padding:0; }
  .lbbox { grid-template-columns:1fr; border-radius:0; max-height:100vh; height:100vh; padding:16px; gap:14px; }
  .lbbox img { max-width:min(340px,78vw); margin:0 auto; }
  .thumb { width:56px; }
  .lbclose { width:44px; height:44px; }
}
/* --- kom i gang --- */
.onb { background:var(--card); border:1px solid var(--accent); border-radius:12px; padding:16px 18px;
  margin-bottom:16px; max-width:720px; }
.onb h2 { font-size:1.05rem; margin-bottom:4px; }
.onb .sub { font-size:.85rem; color:var(--muted); margin-bottom:12px; }
.onb ol { margin:0 0 0 20px; }
.onb li { font-size:.9rem; line-height:1.55; margin:8px 0; }
.onb li.done { color:var(--muted); text-decoration:line-through; }
.onb li.done::marker { content:"✓ "; }
.onb code { background:#0d0e14; padding:3px 7px; border-radius:5px; font-size:.85em; word-break:break-all; }
.onb .acts { margin-top:14px; display:flex; gap:8px; flex-wrap:wrap; }
/* --- telefon --- */
@media (max-width:640px) {
  header { padding:10px 12px; }
  #view { padding:12px; }
  .brand { font-size:1.05rem; }
  .me .nm { display:none; }              /* navnet fylder for meget i headeren */
  nav { gap:5px; }
  nav button { padding:9px 11px; font-size:.82rem; flex:1 1 auto; }
  .grid { grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; }
  .heart { width:44px; height:44px; font-size:1.25rem; }   /* tommelfingervenligt */
  button.act, input, select { padding:11px 13px; font-size:.95rem; }  /* undgår iOS-zoom */
  .fgrid { grid-template-columns:1fr; gap:14px; }
  .chip { padding:9px 14px; font-size:.85rem; }
  .fbar { flex-direction:column; align-items:stretch; }
  .fbar select, .fbar button { width:100%; }
  .tcols { grid-template-columns:1fr; }
  .hubrow { flex-direction:column; align-items:flex-start; gap:6px; }
  .bal { flex-direction:column; align-items:stretch; }
  .bal button { margin-left:0 !important; width:100%; }
  .binderrow { flex-direction:column; align-items:flex-start; gap:8px; }
  .seg { width:100%; } .seg button { flex:1; padding:10px 6px; }
  .titem { padding:10px 0; }
  .titem input { width:20px; height:20px; }
}
/* --- filterpanel --- */
.panel { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:14px; display:none; }
.panel.open { display:block; }
.fgrid { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:12px 14px; }
.fgrid label { margin:0 0 4px; }
.fgrid input,.fgrid select { width:100%; }
.pair2 { display:flex; gap:6px; } .pair2 input { width:100%; }
.chips { display:flex; gap:5px; flex-wrap:wrap; }
.chip { border:1px solid #343850; background:var(--card2); color:var(--muted); border-radius:8px; padding:6px 10px;
  font-size:.8rem; font-weight:700; cursor:pointer; }
.chip.on { border-color:var(--accent); color:var(--accent); background:#2e2a1c; }
.chip.W.on{color:#f5eeda;border-color:#f5eeda;background:#33312a} .chip.U.on{color:#7fb6e8;border-color:#7fb6e8;background:#1d2a38}
.chip.B.on{color:#b4a7c4;border-color:#b4a7c4;background:#272232} .chip.R.on{color:#e8836f;border-color:#e8836f;background:#382220}
.chip.G.on{color:#7fc98f;border-color:#7fc98f;background:#1f3126} .chip.C.on{color:#c8ccda;border-color:#c8ccda;background:#2b2f3d}
.fbar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:12px; padding-top:12px; border-top:1px solid var(--line); }
.count { font-size:.85rem; color:var(--muted); }
.binderrow { display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); font-size:.9rem; }
.binderrow .nm { flex:1; }
.seg { display:flex; border:1px solid #343850; border-radius:8px; overflow:hidden; }
.seg button { background:var(--card2); color:var(--muted); border:none; padding:6px 12px; font-size:.78rem; cursor:pointer; }
.seg button.on { background:var(--accent); color:#1a1a1a; font-weight:700; }
.seg button.on.lock { background:var(--lock); color:#241008; }
.seg button.on.list { background:#5a6178; color:#e8e9ee; }
</style>
</head>

// ---------- Valuta: EUR fra Scryfall, kurs fra ECB via frankfurter.dev ----------
const FX = { code: localStorage.getItem("bt.cur") || "EUR", rate: 7.46, day: null };

async function loadRate(){
  const today = new Date().toISOString().slice(0,10);
  try {
    const c = JSON.parse(localStorage.getItem("bt.fx") || "null");
    if (c && c.day === today) { FX.rate = c.rate; FX.day = c.day; return; }
  } catch {}
  try {
    const r = await (await fetch("https://api.frankfurter.dev/v1/latest?from=EUR&to=DKK")).json();
    if (r?.rates?.DKK) {
      FX.rate = r.rates.DKK; FX.day = r.date || today;
      localStorage.setItem("bt.fx", JSON.stringify({ day: today, rate: FX.rate }));
    }
  } catch { /* behold fallback-kursen */ }
}

const nf = (v,d) => v.toLocaleString("da-DK",{minimumFractionDigits:d,maximumFractionDigits:d});
const money = eur => {
  if (eur == null) return "";
  if (FX.code === "EUR") return `${nf(eur,2)} €`;
  const v = eur * FX.rate;
  return `${nf(v, v < 10 ? 1 : 0)} kr`;
};
// Brugerindtastede prisgrænser er i den viste valuta — regn dem om til EUR.
const toEur = v => FX.code === "EUR" ? v : v / FX.rate;

function renderCur(){
  $("cur").textContent = FX.code === "EUR" ? "€ EUR" : "kr DKK";
  $("cur").title = `1 € = ${FX.rate.toFixed(4)} kr (ECB${FX.day ? ", " + FX.day : ""}) — klik for at skifte`;
}

// ---------- Binder-status ----------
// ManaBox eksporterer både den fysiske samling og lister/wishlists i samme CSV.
// Et kort i en liste er en reference til et kort man ejer i forvejen — ikke et
// ekstra eksemplar — så det må hverken tælles med eller optræde i matches.
//   trade = fysisk, til handel
//   deck  = fysisk, men bundet i et deck
//   list  = ikke fysisk
// Ejerens eget valg (users/{uid}.binderMode) vinder over ManaBox' Binder Type.
const MODE_LABEL = { trade:"Til handel", deck:"Låst til deck", list:"Ikke fysisk (liste)" };

function autoMode(binderType){
  const t = String(binderType||"").toLowerCase();
  if (t.includes("list") || t.includes("wish")) return "list";
  if (t.includes("deck")) return "deck";
  return "trade";
}
function modesOf(uid){
  const u = usersById[uid] || {};
  const m = { ...(u.binderMode || {}) };
  for (const b of (u.lockedBinders || [])) if (!m[b]) m[b] = "deck";  // bagudkompat
  return m;
}
const modeOf = (c, modes) => (c.binder && modes[c.binder]) || autoMode(c.binderType);

// ---------- Forældede samlinger ----------
// Går en Drive-mappe i stykker, fejler nat-jobbet tavst for netop den person, og
// de andre handler videre på forældede data. Vi siger det højt i stedet.
const STALE_DAYS = 30;
function ageInDays(updated){
  if (!updated) return null;
  const t = new Date(updated).getTime();
  return isNaN(t) ? null : Math.floor((Date.now() - t) / 86400000);
}
const isStale = updated => { const d = ageInDays(updated); return d != null && d >= STALE_DAYS; };
const staleNote = updated => {
  const d = ageInDays(updated);
  return d == null ? "" : ` ⚠ ikke opdateret i ${d} dage`;
};

// ---------- Navneindeks (matching i browseren) ----------
// Nat-jobbet skriver et kompakt indeks pr. person: [navn, mode, pris, antal].
// Vi matcher wants mod det her i stedet for at vente på et nattekørsel — og
// slipper for at hente alles fulde samlinger (flere MB) bare for at matche.
const MODE_FROM_CHAR = { t:"trade", d:"deck", l:"list" };
const idxCache = {};

async function loadIndex(uid){
  if (idxCache[uid]) return idxCache[uid];
  const s = await getDoc(doc(db,"collections",uid,"index","names"));
  const m = new Map();
  if (s.exists()){
    // rows er tekstblokke med én linje pr. kort: navn \t mode \t pris \t antal.
    // (Firestore tillader ikke arrays inde i arrays, derfor tekst.)
    for (const block of (s.data().rows || []))
      for (const line of block.split("\n")){
        if (!line) continue;
        const [n, ch, eur, qty] = line.split("\t");
        m.set(n, { mode: MODE_FROM_CHAR[ch] || "trade",
                   eur: eur ? Number(eur) : null,
                   qty: Number(qty) || 1 });
      }
  }
  idxCache[uid] = m;
  return m;
}

// Hvilke af mine wants har denne person — og er de reelt til handel?
function hitsIn(index, wants, includeDeck){
  const out = [];
  for (const w of wants){
    const n = String(w.name || w).toLowerCase();
    const e = index.get(n) || index.get(front(n));
    if (!e || e.mode === "list") continue;
    if (e.mode === "deck" && !includeDeck) continue;
    out.push({ name: w.name || w, scryfallId: w.scryfallId || "", ...e });
  }
  return out;
}

// Hent en persons fulde kortliste (kun når man åbner en konkret handel).
const cardCache = {};
async function loadCards(uid){
  if (cardCache[uid]) return cardCache[uid];
  const meta = await getDoc(doc(db,"collections",uid));
  if (!meta.exists()) return [];
  const cs = await Promise.all(Array.from({length:meta.data().chunks||0},
    (_,i)=>getDoc(doc(db,"collections",uid,"chunks",String(i)))));
  cardCache[uid] = cs.flatMap(s=>s.exists()?s.data().cards:[]);
  return cardCache[uid];
}

// ---------- Scryfall-søgning (avanceret syntaks) ----------
async function scryfallNames(q){
  let url = `https://api.scryfall.com/cards/search?q=${encodeURIComponent(q)}&unique=cards&order=name`;
  const names = new Set(); let pages = 0, more = false;
  while (url && pages < 5) {
    const r = await (await fetch(url)).json();
    if (r.object === "error") throw new Error(r.details || "ugyldig søgning");
    (r.data || []).forEach(c => { names.add(c.name.toLowerCase()); names.add(front(c.name)); });
    more = !!r.has_more; url = r.has_more ? r.next_page : null; pages++;
  }
  return { names, truncated: more };
}

// ---------- Kortvisning (zoom) ----------
// Miniaturerne er for små til at læse regeltekst på. Klik på et kort åbner det
// stort med alle detaljer. Manglende data (fx på wants, der kun har navn)
// hentes fra Scryfall når visningen åbnes.
const scryBig = (id, face="front") => id
  ? `https://cards.scryfall.io/large/${face}/${id[0]}/${id[1]}/${id}.jpg` : "";

let lbList = [], lbIdx = 0, lbFace = "front", lbOnWant = null;

function openCard(card, list, idx, onWant){
  lbList = list && list.length ? list : [card];
  lbIdx = Number.isInteger(idx) ? idx : 0;
  lbOnWant = onWant || null;
  lbFace = "front";
  $("lightbox").classList.add("on");
  document.body.style.overflow = "hidden";
  drawCard();
}

function closeCard(){
  $("lightbox").classList.remove("on");
  document.body.style.overflow = "";
  lbList = [];
}

function stepCard(d){
  if (lbList.length < 2) return;
  lbIdx = (lbIdx + d + lbList.length) % lbList.length;
  lbFace = "front";
  drawCard();
}

async function drawCard(){
  const c = lbList[lbIdx];
  if (!c) return closeCard();
  const wn = wantNames();
  const isWant = wn.has(c.name.toLowerCase()) || wn.has(front(c.name));
  const many = lbList.length > 1;
  const row = (k,v) => v ? `<div><span>${k}</span><span>${v}</span></div>` : "";
  const modeLabel = c._mode ? MODE_LABEL[c._mode] : "";

  $("lbbox").innerHTML = `
    <button class="lbclose" id="lbx" aria-label="Luk">✕</button>
    <div class="lbimg">
      <img id="lbpic" src="${scryBig(c.scryfallId, lbFace)}" alt="${esc(c.name)}"
           title="Klik for fuld opløsning" onerror="this.style.opacity=.15">
      <button class="lbflip" id="lbflip" style="display:none">↺ Vend kortet</button>
    </div>
    <div>
      <div class="lbh1">${esc(c.name)}</div>
      ${c.mana?`<div class="lbmana">${esc(c.mana)}</div>`:""}
      ${c.type?`<div class="lbtype">${esc(c.type)}</div>`:""}
      <div class="lbtext" id="lbtext">${c.text?esc(c.text):`<span style="color:var(--muted)">Henter regeltekst fra Scryfall...</span>`}</div>
      <div class="lbrows">
        ${row("Ejer", esc(c._ownerName||""))}
        ${row("Sæt", [esc(c.setName||c.set||""), c.cn?"#"+esc(c.cn):""].filter(Boolean).join(" "))}
        ${row("Sjældenhed", esc(c.rarity||""))}
        ${row("Mana value", c.cmc!=null?c.cmc:"")}
        ${row("Stand", esc(c.condition||""))}
        ${row("Antal", c.qty>1?`${c.qty} stk.`:"")}
        ${row("Binder", [esc(c.binder||""), modeLabel?`(${modeLabel.toLowerCase()})`:""].filter(Boolean).join(" "))}
        ${row("Pris", c.eur!=null?money(c.eur):"")}
      </div>
      <div class="lbacts">
        <button class="act ${isWant?"":"primary"}" id="lbwant">${isWant?"♥ Fjern fra wants":"♡ Tilføj til mine wants"}</button>
        ${c.scryfallId?`<a class="act" href="https://scryfall.com/card/${esc(c.scryfallId)}" target="_blank" rel="noopener" style="text-decoration:none">Scryfall ↗</a>`:""}
        ${many?`<span class="lbnav">
          <button class="act" id="lbprev" aria-label="Forrige">←</button>
          <span style="align-self:center;font-size:.82rem;color:var(--muted)">${lbIdx+1}/${lbList.length}</span>
          <button class="act" id="lbnext" aria-label="Næste">→</button></span>`:""}
      </div>
    </div>`;

  $("lbx").onclick = closeCard;
  // Klik på billedet åbner Scryfalls fulde opløsning (745×1040 PNG) i ny fane.
  // Vi viser 'large'-udgaven som standard, så mobildata ikke brændes af unødigt.
  $("lbpic").onclick = () => {
    if (!c.scryfallId) return;
    const id = c.scryfallId;
    window.open(`https://cards.scryfall.io/png/${lbFace}/${id[0]}/${id[1]}/${id}.png`,
                "_blank", "noopener");
  };
  if (many){ $("lbprev").onclick = () => stepCard(-1); $("lbnext").onclick = () => stepCard(1); }
  $("lbwant").onclick = async () => {
    await toggleWant({ name:c.name, id:c.scryfallId, set:c.set, cn:c.cn });
    if (lbOnWant) lbOnWant();
    drawCard();
  };

  // Dobbeltsidede kort: prøv bagsiden, og vis kun knappen hvis den findes.
  if (c.scryfallId){
    const probe = new Image();
    probe.onload = () => {
      const b = $("lbflip");
      if (!b) return;
      b.style.display = "block";
      b.textContent = lbFace === "front" ? "↺ Vis bagsiden" : "↺ Vis forsiden";
      b.onclick = () => { lbFace = lbFace === "front" ? "back" : "front"; drawCard(); };
    };
    probe.src = scryBig(c.scryfallId, lbFace === "front" ? "back" : "front");
  }

  // Wants har kun navn og ID — hent resten fra Scryfall når visningen er åben.
  if (!c.text && c.scryfallId){
    try {
      const d = await (await fetch(`https://api.scryfall.com/cards/${encodeURIComponent(c.scryfallId)}`)).json();
      const faces = d.card_faces || [];
      const join = k => d[k] || faces.map(f=>f[k]).filter(Boolean).join("\n//\n");
      Object.assign(c, { text:join("oracle_text"), type:join("type_line"), mana:join("mana_cost"),
                         cmc:d.cmc, rarity:c.rarity||d.rarity, setName:c.setName||d.set_name,
                         eur:c.eur ?? (d.prices?.eur ? Number(d.prices.eur) : null) });
      if (lbList[lbIdx] === c) drawCard();
    } catch { if ($("lbtext")) $("lbtext").innerHTML = `<span style="color:var(--muted)">Kunne ikke hente regelteksten.</span>`; }
  }
}

$("lightbox").onclick = e => { if (e.target.id === "lightbox") closeCard(); };
document.addEventListener("keydown", e => {
  if (!$("lightbox").classList.contains("on")) return;
  if (e.key === "Escape") closeCard();
  if (e.key === "ArrowLeft") stepCard(-1);
  if (e.key === "ArrowRight") stepCard(1);
});

        <div><label>Pris (<span class="curlbl">${FX.code==="EUR"?"€":"kr"}</span>)</label>
          <div class="pair2"><input id="pmin" type="number" min="0" placeholder="fra"><input id="pmax" type="number" min="0" placeholder="til"></div>

        <div><label>Mine wants</label>
          <select id="want"><option value="">Alle kort</option><option value="1">Kun mine wants</option><option value="0">Skjul mine wants</option></select>

          <button class="act" id="sqgo" style="white-space:nowrap">Søg</button>
          <button class="act" id="sqclr" style="white-space:nowrap">Ryd</button></div>
          <p class="hint" id="sqhint">Bruger Scryfalls egen søgemaskine og skærer resultatet mod samlingen. Max 875 kort pr. søgning.</p>
        </div>
      </div>
      <div class="fbar">
        <label style="margin:0">Sortér</label>
        <select id="sort">
          <option value="name">Navn A-Å</option>
          <option value="price-desc">Pris, højeste først</option>
          <option value="price-asc">Pris, laveste først</option>
          <option value="cmc-asc">Mana value, lav→høj</option>
          <option value="cmc-desc">Mana value, høj→lav</option>
          <option value="qty-desc">Antal, flest først</option>
          <option value="set">Sæt</option>
          <option value="owner">Ejer</option>
        </select>
        <button class="act" id="clr">Nulstil filtre</button>
        <span class="count" id="count"></span>
      </div>
    </div>
    <div id="status" style="color:var(--muted);font-size:.85rem;margin-bottom:12px"></div>
    <div class="grid" id="grid"></div>
    <button class="act" id="more" style="display:none;margin:16px auto">Vis flere</button>`;

  await loadUsers();
  $("onbslot").innerHTML = onboardingHtml(usersById[user.uid]);
  bindOnboarding();
  const cols = {};
  for (const u of Object.values(usersById)) {
    const c = await getDoc(doc(db,"collections",u.id));
    if (c.exists()) cols[u.id] = { ...u, ...c.data() };
  }
  const ids = Object.keys(cols);
  const totalUnique = ids.reduce((s,id)=>s+(cols[id].uniqueCount||0),0);
  $("who").innerHTML = ids.length
    ? (ids.length > 1 ? `<option value="*">🌍 Alle samlinger (${totalUnique} kort)</option>` : "")
      + ids.map(id=>`<option value="${esc(id)}">${esc(cols[id].name)} (${cols[id].uniqueCount||0} kort)</option>`).join("")
    : `<option>Ingen samlinger endnu</option>`;

  let cards = [], filtered = [], shown = 0, ownerId = null, modes = {}, baseStatus = "";
  const modesByUid = {};
  ids.forEach(id => modesByUid[id] = modesOf(id));
  // I "Alle"-visning bærer hvert kort sin ejer, så binder-status slås op hos den
  // rigtige person — ikke hos den der tilfældigvis er valgt i dropdownen.
  const modesFor = c => c._owner ? (modesByUid[c._owner] || {}) : modes;

  async function load(id){
    ownerId = id;
    const all = id === "*";
    if (!all && !cols[id]) return;
    $("status").textContent = all ? `Henter alle ${ids.length} samlinger...` : "Henter...";

    if (all) {
      const lists = await Promise.all(ids.map(u => loadCards(u)));
      cards = lists.flatMap((list, i) => list.map(c =>
        ({ ...c, _owner: ids[i], _ownerName: cols[ids[i]].name })));
      modes = {};
    } else {
      modes = modesByUid[id] || modesOf(id);
      cards = await loadCards(id);
    }

    fillOptions(all ? null : cols[id]);
    syncPanel();
    const n = { trade:0, deck:0, list:0 };
    cards.forEach(c => n[modeOf(c, modesFor(c))]++);
    const upd = all ? null : cols[id].updated;
    baseStatus = (all ? `Alle ${ids.length} samlinger` : cols[id].name)
      + `: ${n.trade + n.deck} fysiske kort`
      + (all ? "" : ` · opdateret ${new Date(upd).toLocaleString("da")}`)
      + (n.deck ? ` · ${n.deck} låst til decks` : "")
      + (n.list ? ` · ${n.list} i lister (skjult)` : "")
      + (!all && isStale(upd) ? staleNote(upd) : "")
      + (all && ids.some(u => isStale(cols[u].updated))
          ? ` ⚠ ${ids.filter(u=>isStale(cols[u].updated)).map(u=>cols[u].name).join(", ")} er forældet` : "");
    $("status").style.color = (all ? ids.some(u=>isStale(cols[u].updated)) : isStale(upd))
      ? "var(--lock)" : "var(--muted)";
    draw();
  }

  function fillOptions(meta){
    const uniq = k => [...new Set(cards.map(c=>c[k]).filter(Boolean))].sort();
    $("set").innerHTML = `<option value="">Alle sæt</option>` +
      uniq("set").map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join("");
    $("cond").innerHTML = `<option value="">Alle</option>` +
      uniq("condition").map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join("");
    // meta.binders er objekter {name,type,mode,...}; ældre sync gav rene strenge.
    // I "Alle"-visning findes der ingen fælles meta — så udled navnene af kortene.
    const raw = (meta && meta.binders && meta.binders.length) ? meta.binders : uniq("binder");
    const binders = raw.map(b => typeof b === "string" ? { name:b } : b);
    $("binder").innerHTML = `<option value="">Alle bindere</option>` +
      binders.map(b=>{
        const m = meta ? (modes[b.name] || autoMode(b.type)) : "trade";
        return `<option value="${esc(b.name)}">${esc(b.name)}${meta && m!=="trade"?` (${MODE_LABEL[m].toLowerCase()})`:""}</option>`;
      }).join("") +
      (binders.length ? "" : `<option disabled>ingen binder-data i eksporten</option>`);
    $("set").value = F.set; $("cond").value = F.cond; $("binder").value = F.binder;
  }

  // Filtrene lever i F på modulniveau, så de overlever fx et valutaskift
  // (som gentegner hele viewet). Skriv dem tilbage i kontrollerne.
  function syncPanel(){
    ["q","text","type","cmcMin","cmcMax","pmin","pmax","sq"].forEach(k=>{ if($(k)) $(k).value = F[k] || ""; });
    ["foil","lock","want","sort","cmode"].forEach(k=>{ if($(k)) $(k).value = F[k]; });
    $("colors").querySelectorAll(".chip").forEach(c=>c.classList.toggle("on", F.colors.has(c.dataset.c)));
    $("rar").querySelectorAll(".chip").forEach(c=>c.classList.toggle("on", F.rar.has(c.dataset.r)));
    const active = F.q||F.text||F.type||F.set||F.cond||F.binder||F.foil||F.lock||F.want
      ||F.cmcMin!==""||F.cmcMax!==""||F.pmin!==""||F.pmax!==""||F.colors.size||F.rar.size||F.sqNames;
    if (active) $("panel").classList.add("open");
  }

  function pass(c){
    const wn = wantNames();
    if (F.q && !c.name.toLowerCase().includes(F.q)) return false;
    if (F.text && !String(c.text||"").toLowerCase().includes(F.text)) return false;
    if (F.type && !String(c.type||"").toLowerCase().includes(F.type)) return false;
    if (F.set && c.set !== F.set) return false;
    if (F.cond && c.condition !== F.cond) return false;
    if (F.binder && c.binder !== F.binder) return false;
    if (F.foil === "1" && !c.foil) return false;
    if (F.foil === "0" && c.foil) return false;
    if (F.rar.size && !F.rar.has(String(c.rarity||"").toLowerCase())) return false;
    if (F.cmcMin !== "" && !(Number(c.cmc ?? -1) >= Number(F.cmcMin))) return false;
    if (F.cmcMax !== "" && !(Number(c.cmc ?? 1e9) <= Number(F.cmcMax))) return false;
    if (F.pmin !== "" && !(c.eur != null && c.eur >= toEur(Number(F.pmin)))) return false;
    if (F.pmax !== "" && !(c.eur != null && c.eur <= toEur(Number(F.pmax)))) return false;
    const mode = modeOf(c, modesFor(c));
    if (F.lock === "trade"  && mode !== "trade") return false;
    if (F.lock === "locked" && mode !== "deck")  return false;
    if (F.lock === "list"   && mode !== "list")  return false;
    if (F.lock === ""       && mode === "list")  return false;   // standard: skjul lister
    const isW = wn.has(c.name.toLowerCase()) || wn.has(front(c.name));
    if (F.want === "1" && !isW) return false;
    if (F.want === "0" && isW) return false;
    if (F.colors.size) {
      // ci er Scryfalls color_identity. Farveløse kort har tom/manglende ci og
      // matcher chippen "C" — men de er også "indeholdt i" enhver farveidentitet,
      // hvilket er hele pointen når man leder efter kort til et bestemt deck.
      const raw = new Set(c.ci || []);
      const colorless = raw.size === 0;
      const wantsC = F.colors.has("C");
      const sel = new Set([...F.colors].filter(x => x !== "C"));
      // "C" er farveløs og lægges til som et alternativ — vælger man W og C,
      // menes mono-hvide ELLER farveløse kort.
      let ok;
      switch (F.cmode) {
        case "within": ok = colorless || [...raw].every(x=>sel.has(x)); break;
        case "all":    ok = (wantsC && colorless)
                         || (sel.size > 0 && [...sel].every(x=>raw.has(x))); break;
        case "any":    ok = (wantsC && colorless) || [...sel].some(x=>raw.has(x)); break;
        // Standard: præcis de valgte farver. W = mono-hvid, ikke WB.
        default:       ok = (wantsC && colorless)
                         || (sel.size > 0 && raw.size === sel.size
                             && [...sel].every(x=>raw.has(x)));
      }
      if (!ok) return false;
    }
    if (F.sqNames && !(F.sqNames.has(c.name.toLowerCase()) || F.sqNames.has(front(c.name)))) return false;
    return true;
  }

  function sortCards(a,b){
    switch (F.sort) {
      case "price-desc": return (b.eur ?? -1) - (a.eur ?? -1);
      case "price-asc":  return (a.eur ?? 1e9) - (b.eur ?? 1e9);
      case "cmc-asc":    return (a.cmc ?? 1e9) - (b.cmc ?? 1e9) || a.name.localeCompare(b.name,"da");
      case "cmc-desc":   return (b.cmc ?? -1) - (a.cmc ?? -1) || a.name.localeCompare(b.name,"da");
      case "qty-desc":   return (b.qty||0) - (a.qty||0);
      case "set":        return String(a.set).localeCompare(String(b.set)) || a.name.localeCompare(b.name,"da");
      case "owner":      return String(a._ownerName||"").localeCompare(String(b._ownerName||""),"da")
                             || a.name.localeCompare(b.name,"da");
      default:           return a.name.localeCompare(b.name,"da");
    }
  }

  function draw(){
    filtered = cards.filter(pass).sort(sortCards);
    const val = filtered.reduce((s,c)=>s + (c.eur||0) * (c.qty||1), 0);
    const summary = `${filtered.length} af ${cards.length} kort${val ? " · " + money(val) : ""}`;
    $("count").textContent = summary;
    $("status").textContent = baseStatus + (filtered.length !== cards.length ? ` · viser ${summary}` : "");
    $("grid").innerHTML = ""; shown = 0; more();
  }

  function more(){
    const wn = wantNames();
    const slice = filtered.slice(shown, shown+100);
    $("grid").insertAdjacentHTML("beforeend", slice.map((c,i)=>
      cardHtml(c, wn.has(c.name.toLowerCase()) || wn.has(front(c.name)), modeOf(c,modesFor(c)), shown+i)).join(""));
    shown += slice.length;
    $("more").style.display = shown < filtered.length ? "block" : "none";
    bindHearts();
  }

  function bindHearts(){
    $("grid").querySelectorAll(".heart").forEach(h => h.onclick = async e => {
      e.stopPropagation();                       // ellers åbner zoom-visningen også
      const c = filtered[Number(h.dataset.i)];
      await toggleWant({ name:c.name, id:c.scryfallId, set:c.set, cn:c.cn });
      draw();
    });
    $("grid").querySelectorAll(".card").forEach(el => el.onclick = () => {
      const i = Number(el.dataset.i);
      openCard({ ...filtered[i], _mode: modeOf(filtered[i], modesFor(filtered[i])) }, filtered, i, draw);
    });
  }

  // --- events ---
  $("who").onchange = e => load(e.target.value);
  $("ftog").onclick = () => $("panel").classList.toggle("open");
  const deb = (fn,ms=250) => { let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a),ms); }; };
  $("q").oninput    = deb(e => { F.q = e.target.value.toLowerCase().trim(); draw(); });
  $("text").oninput = deb(e => { F.text = e.target.value.toLowerCase().trim(); draw(); });
  $("type").oninput = deb(e => { F.type = e.target.value.toLowerCase().trim(); draw(); });
  ["set","cond","binder","foil","lock","want","sort"].forEach(k =>
    $(k).onchange = e => { F[k === "cond" ? "cond" : k] = e.target.value; draw(); });
  ["cmcMin","cmcMax","pmin","pmax"].forEach(k =>
    $(k).oninput = deb(e => { F[k] = e.target.value; draw(); }));
  $("cmode").onchange = e => { F.cmode = e.target.value; draw(); };
  $("colors").querySelectorAll(".chip").forEach(ch => ch.onclick = () => {
    const c = ch.dataset.c; F.colors.has(c) ? F.colors.delete(c) : F.colors.add(c);
    ch.classList.toggle("on"); draw();
  });
  $("rar").querySelectorAll(".chip").forEach(ch => ch.onclick = () => {
    const r = ch.dataset.r; F.rar.has(r) ? F.rar.delete(r) : F.rar.add(r);
    ch.classList.toggle("on"); draw();
  });
  $("sqgo").onclick = async () => {
    const q = $("sq").value.trim();
    if (!q) { F.sqNames = null; $("sqhint").textContent = "Ryddet."; return draw(); }
    $("sqhint").textContent = "Søger hos Scryfall...";
    try {
      const { names, truncated } = await scryfallNames(q);
      F.sqNames = names;
      $("sqhint").textContent = `Scryfall gav ${names.size} navne${truncated ? " (afkortet ved 875 — snævr søgningen ind)" : ""}.`;
      draw();
    } catch (e) { F.sqNames = null; $("sqhint").textContent = `Scryfall: ${e.message}`; draw(); }
  };
  $("sq").onkeydown = e => { if (e.key === "Enter") $("sqgo").click(); };
  $("sqclr").onclick = () => { $("sq").value = ""; F.sqNames = null; $("sqhint").textContent = "Ryddet."; draw(); };
  $("more").onclick = more;
  $("clr").onclick = () => {
    Object.assign(F, { q:"", text:"", type:"", cmcMin:"", cmcMax:"", set:"", foil:"", cond:"",
                       binder:"", lock:"", want:"", pmin:"", pmax:"", sort:"name", sq:"", sqNames:null });
    F.colors.clear(); F.rar.clear();
    ["q","text","type","cmcMin","cmcMax","pmin","pmax","sq"].forEach(k=>{ if($(k)) $(k).value=""; });
    ["set","cond","binder","foil","lock","want"].forEach(k=>{ if($(k)) $(k).value=""; });
    $("sort").value = "name"; $("cmode").value = "exact";
    $("panel").querySelectorAll(".chip").forEach(c=>c.classList.remove("on"));
    draw();
  };

  if (ids.length) load(ids[0]); else $("status").textContent = "Ingen samlinger synket endnu.";
}

function cardHtml(c, isWant, mode, idx){
  const dim = mode === "deck" || mode === "list";
  const modeBadge = mode === "deck" ? `<span class="badge lockb">I DECK</span>`
                  : mode === "list" ? `<span class="badge listb">LISTE</span>` : "";
  const p = c.eur != null ? `<div class="price">${money(c.eur)}${c.qty>1?` <span style="color:var(--muted);font-weight:400">· i alt ${money(c.eur*c.qty)}</span>`:""}</div>` : "";
  return `<div class="card${isWant?' want':''}${dim?' locked':''}"${idx!=null?` data-i="${idx}" style="cursor:zoom-in"`:""}>
    <div class="badges">${c.qty>1?`<span class="badge qty">x${c.qty}</span>`:""}${c.foil?`<span class="badge foil">FOIL</span>`:""}${isWant?`<span class="badge wantb">WANT</span>`:""}${modeBadge}</div>
    ${idx!=null?`<button class="heart${isWant?' on':''}" data-i="${idx}" title="${isWant?'Fjern fra wants':'Tilføj til mine wants'}">${isWant?'♥':'♡'}</button>`:""}
    <img loading="lazy" src="${scryImg(c.scryfallId)}" onerror="this.style.opacity=.15">
    <div class="info"><div class="name">${esc(c.name)}</div>
      <div class="meta">${c._ownerName?`<b style="color:var(--accent)">${esc(c._ownerName)}</b> · `:""}${esc(c.set||"")} ${c.cn?"#"+esc(c.cn):""}${c.condition?" · "+esc(c.condition):""}${c.binder?" · "+esc(c.binder):""}</div>
      ${p}</div></div>`;
}

function renderWants(){
  view.innerHTML = `<div class="field">
    <div class="row"><input id="search" placeholder="Søg kort på Scryfall..." style="flex:1;min-width:200px" autocomplete="off">
    <button class="act" id="imp">Importér fra Archidekt/Moxfield</button></div>
    <div id="results" class="grid" style="margin-top:14px"></div>
  </div>
  <div class="row" style="margin:24px 0 12px;align-items:baseline">
    <h2 style="font-size:1.1rem">❤️ Mine wants (<span id="wc">${myWants.length}</span>)</h2>
    <button class="act" id="wexp" style="margin-left:auto;padding:6px 11px;font-size:.82rem">Gem som fil</button>
    <button class="act" id="wimpbtn" style="padding:6px 11px;font-size:.82rem">Indlæs fra fil</button>
    <input type="file" id="wfile" accept="application/json,.json" style="display:none">
  </div>
  <p class="hint" style="margin:-6px 0 12px">Samlinger kan altid genskabes fra ManaBox — dine wants findes kun her. Tag en kopi en gang imellem.</p>
  <div id="mine" class="grid"></div>`;
  const sb=$("search"); let t;
  sb.oninput=()=>{ clearTimeout(t); t=setTimeout(()=>doSearch(sb.value),300); };
  $("imp").onclick=importDeck;
  $("wexp").onclick=exportWants;
  $("wimpbtn").onclick=()=>$("wfile").click();
  $("wfile").onchange=e=>importWantsFile(e.target.files[0]);
  drawMine();
}

function exportWants(){
  const data = { app:"binder-tutor", version:APP_VERSION, exported:new Date().toISOString(),
                 user:user.displayName, cards:myWants };
  const url = URL.createObjectURL(new Blob([JSON.stringify(data,null,2)], {type:"application/json"}));
  const a = document.createElement("a");
  a.href = url;
  a.download = `binder-tutor-wants-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast(`${myWants.length} wants gemt som fil`);
}

async function importWantsFile(file){
  if (!file) return;
  try {
    const d = JSON.parse(await file.text());
    const incoming = Array.isArray(d) ? d : (d.cards || []);
    if (!Array.isArray(incoming) || !incoming.length) return toast("Filen indeholder ingen wants");
    // Flet ind frem for at overskrive — så en gammel backup ikke sletter nye wants.
    const have = new Set(myWants.map(w => w.name.toLowerCase()));
    let added = 0;
    for (const c of incoming){
      const name = typeof c === "string" ? c : c.name;
      if (!name || have.has(String(name).toLowerCase())) continue;
      myWants.push({ name:String(name), scryfallId:c.scryfallId||"", set:c.set||"", cn:c.cn||"" });
      have.add(String(name).toLowerCase());
      added++;
    }
    if (!added) return toast("Ingen nye wants i filen");
    await saveWants();
    if ($("wc")) $("wc").textContent = myWants.length;
    drawMine();
    toast(`${added} wants tilføjet`);
  } catch(e){ toast(`Kunne ikke læse filen: ${e.message}`); }
}

async function doSearch(q){
  const r=$("results"); if(q.trim().length<2){r.innerHTML="";return;}
  try{
    const ac=await (await fetch(`https://api.scryfall.com/cards/autocomplete?q=${encodeURIComponent(q)}`)).json();
    const names=(ac.data||[]).slice(0,8);
    const cards=await Promise.all(names.map(n=>fetch(`https://api.scryfall.com/cards/named?exact=${encodeURIComponent(n)}`).then(x=>x.json())));
    const wn=wantNames();
    r.innerHTML=cards.map((c,i)=>{
      const on=wn.has(c.name.toLowerCase());
      const eur = c.prices?.eur ? Number(c.prices.eur) : null;
      return `<div class="card${on?' want':''}" data-i="${i}" style="cursor:zoom-in">
        <button class="heart${on?' on':''}" data-i="${i}">${on?'♥':'♡'}</button>
        <img loading="lazy" src="${scryImg(c.id)}" onerror="this.style.opacity=.15">
        <div class="info"><div class="name">${esc(c.name)}</div>
          <div class="meta">${esc((c.set||'').toUpperCase())} #${esc(c.collector_number||'')}</div>
          ${eur!=null?`<div class="price">${money(eur)}</div>`:""}</div></div>`;
    }).join("");
    // Scryfall-svaret har allerede alt vi skal bruge til zoom-visningen.
    const asCard = c => ({ name:c.name, scryfallId:c.id, set:(c.set||'').toUpperCase(),
      setName:c.set_name, cn:c.collector_number||'', rarity:c.rarity, cmc:c.cmc,
      type:c.type_line || (c.card_faces||[]).map(f=>f.type_line).filter(Boolean).join("\n//\n"),
      text:c.oracle_text || (c.card_faces||[]).map(f=>f.oracle_text).filter(Boolean).join("\n//\n"),
      mana:c.mana_cost || (c.card_faces||[]).map(f=>f.mana_cost).filter(Boolean).join("\n//\n"),
      eur:c.prices?.eur ? Number(c.prices.eur) : null });
    r.querySelectorAll(".heart").forEach(h=>h.onclick=e=>{
      e.stopPropagation();
      const c=cards[Number(h.dataset.i)];
      toggleWant({name:c.name, id:c.id, set:(c.set||'').toUpperCase(), cn:c.collector_number||''});
    });
    r.querySelectorAll(".card").forEach(el=>el.onclick=()=>{
      const i=Number(el.dataset.i);
      openCard(asCard(cards[i]), cards.map(asCard), i, ()=>doSearch($("search").value));
    });
  }catch(e){ r.innerHTML=`<p class="hint">Kunne ikke søge: ${esc(e.message)}</p>`; }
}

async function toggleWant(d){
  const i=myWants.findIndex(w=>w.name.toLowerCase()===String(d.name).toLowerCase());
  if(i>=0){ myWants.splice(i,1); toast(`${d.name} fjernet fra wants`); }
  else { myWants.push({name:d.name, scryfallId:d.id||"", set:d.set||"", cn:d.cn||""}); toast(`${d.name} tilføjet til wants`); }
  await saveWants();
  if($("wc"))$("wc").textContent=myWants.length;
  if($("mine")) drawMine();
  if($("search")) doSearch($("search").value);
}

function drawMine(){
  const m=$("mine"); if(!m)return;
  const snapshot = myWants.slice();   // klik-listen må ikke ændre sig under fingrene
  m.innerHTML = myWants.length? myWants.map((w,i)=>`<div class="card want" data-i="${i}" style="cursor:zoom-in">
    <button class="heart on" data-i="${i}">♥</button>
    <img loading="lazy" src="${scryImg(w.scryfallId)}" onerror="this.style.opacity=.15">
    <div class="info"><div class="name">${esc(w.name)}</div><div class="meta">${esc(w.set||'')} ${w.cn?'#'+esc(w.cn):''}</div></div></div>`).join("")
    : `<p class="hint">Ingen wants endnu. Søg et kort ovenfor og tryk på hjertet — eller sæt hjerte direkte på et kort i en vens samling.</p>`;
  m.querySelectorAll(".heart").forEach(h=>h.onclick=e=>{
    e.stopPropagation();
    toggleWant({name:myWants[Number(h.dataset.i)].name});
  });
  m.querySelectorAll(".card").forEach(el=>el.onclick=()=>{
    const i=Number(el.dataset.i);
    openCard({...snapshot[i]}, snapshot.map(w=>({...w})), i, drawMine);
  });
}

async function importDeck(){
  const url=prompt("Indsæt Archidekt- eller Moxfield-URL (deck/collection/wishlist):");
  if(!url)return;
  if(!/archidekt\.com\/(?:decks|collection)\/|moxfield\.com\/(?:decks|collection)\//.test(url)){
    toast("Ukendt URL — kun Archidekt/Moxfield"); return;
  }
  // Archidekt/Moxfield blokerer browser-fetch (CORS), så nat-jobbet henter
  // listen serverside. Vi gemmer bare URL'en på profilen.
  await setDoc(doc(db,"users",user.uid), { pendingImports: arrayUnion(url) }, { merge:true });
  toast("Import gemt — dine wants opdateres ved næste nat-sync");
}

// ---------- Matches ----------
async function renderMatches(){
  view.innerHTML=`<div class="row" style="margin-bottom:12px">
      <label style="margin:0"><input type="checkbox" id="showlock" style="vertical-align:-2px"> Vis også kort der er låst til decks</label>
    </div>
    <div id="mstat" style="color:var(--muted);margin-bottom:12px">Henter...</div><div id="mb"></div>`;
  await loadUsers();
  const others = Object.values(usersById).filter(u => u.id !== user.uid);
  const idxs = await Promise.all(others.map(u => loadIndex(u.id)));

  function draw(){
    const showLocked = $("showlock").checked;
    const rows = others.map((u,i)=>{
      const hits = hitsIn(idxs[i], myWants, showLocked);
      return [u, hits, hits.reduce((s,h)=>s+(h.eur||0),0)];
    }).filter(([,hits])=>hits.length).sort((a,b)=>b[2]-a[2]);

    $("mstat").textContent = rows.length ? ""
      : myWants.length ? "Ingen af dine wants findes hos de andre lige nu — prøv at vise deck-kort også."
      : "Du har ingen wants endnu. Sæt et hjerte på et kort, så dukker der matches op med det samme.";
    $("mb").innerHTML = rows.map(([u,hits,total],ri)=>`<div class="matchbox" data-r="${ri}">
      <h2>💰 ${esc(u.name || u.id)} har ${hits.length} af dine wants — værdi ~${money(total)}</h2>
      ${hits.map((h,i)=>`<div class="pair${h.mode==="deck"?' locked':''}" data-i="${i}">
        <img class="thumb" loading="lazy" src="${scryImg(h.scryfallId)}" alt="" onerror="this.style.opacity=.15">
        <span class="txt">${esc(h.name)}${h.qty>1?` x${h.qty}`:''}${h.eur?` · <b style="color:var(--accent)">${money(h.eur)}</b>`:''}${h.mode==="deck"?' <span class="badge lockb">I DECK</span>':''}</span>
      </div>`).join("")}
    </div>`).join("");

    $("mb").querySelectorAll(".matchbox").forEach(box => box.querySelectorAll(".thumb").forEach(img => img.onclick = () => {
      const hits = rows[Number(box.dataset.r)][1];
      const i = Number(img.closest(".pair").dataset.i);
      openCard({ ...hits[i] }, hits.map(h=>({...h})), i, draw);
    }));
  }
  $("showlock").onchange = draw;
  draw();
}

// ---------- Trading Hub ----------
// Alt regnes i browseren ud fra data der allerede er læsbare, så en ny want
// slår igennem med det samme i stedet for at vente på nat-synket.
const cardKey = c => c.scryfallId || `${c.name}|${c.set||""}|${c.cn||""}`;
const REMINDER = "Husk begge to: scan de nye kort ind i ManaBox, og slet dem I byttede væk fra jeres binder. Ellers matcher appen videre på kort I ikke har længere.";

async function renderTrade(){
  view.innerHTML = `<div id="tstat" style="color:var(--muted);font-size:.9rem">Regner handelsmuligheder ud...</div><div id="hub"></div>`;
  await loadUsers();
  const meDoc = usersById[user.uid] || {};
  const myModes = modesOf(user.uid);
  const myBlock = new Set(meDoc.notForTrade || []);

  // Min egen samling (fuld — jeg skal alligevel kunne vise mine egne kortdetaljer)
  const meta = await getDoc(doc(db,"collections",user.uid));
  const myCards = meta.exists() ? await loadCards(user.uid) : [];
  const myTrade = myCards.filter(c => modeOf(c, myModes) === "trade");

  const others = Object.values(usersById).filter(u => u.id !== user.uid);
  // Alles wants + alles navneindeks. Begge dele er små, så begge retninger
  // regnes live — ingen af dem venter på nat-synket.
  const [wantSnaps, idxs, colMetas] = await Promise.all([
    Promise.all(others.map(u => getDoc(doc(db,"wants",u.id)))),
    Promise.all(others.map(u => loadIndex(u.id))),
    Promise.all(others.map(u => getDoc(doc(db,"collections",u.id)))),
  ]);
  const updatedBy = {};
  others.forEach((u,i)=>{ updatedBy[u.id] = colMetas[i].exists() ? colMetas[i].data().updated : null; });

  const val = list => list.reduce((s,c)=>s+(c.eur||0),0);
  const pairs = others.map((u,i)=>{
    const theirBlock = new Set(u.notForTrade || []);
    // hans kort som jeg vil have — kun det der reelt er til handel
    const iGet = hitsIn(idxs[i], myWants, false)
      .filter(h => !theirBlock.has(h.scryfallId));
    // mine kort som han vil have
    const w = new Set();
    (wantSnaps[i].exists() ? (wantSnaps[i].data().cards || []) : [])
      .forEach(x => { const n = (x.name||x); w.add(String(n).toLowerCase()); w.add(front(n)); });
    const theyGet = myTrade.filter(c => !myBlock.has(cardKey(c))
      && (w.has(c.name.toLowerCase()) || w.has(front(c.name))));
    return { u, iGet, theyGet };
  }).filter(p => p.iGet.length || p.theyGet.length)
    .sort((a,b) => Math.min(b.iGet.length,b.theyGet.length) - Math.min(a.iGet.length,a.theyGet.length)
                || (b.iGet.length+b.theyGet.length) - (a.iGet.length+a.theyGet.length));

  if (!myCards.length) $("tstat").textContent =
    "Du har ingen synket samling endnu, så vi kan kun vise hvad andre har til dig. Udfyld Drive-mappen under Min profil.";
  else if (!pairs.length) $("tstat").textContent =
    "Ingen handelsmuligheder lige nu. Sæt flere hjerter, eller vent til vennerne opdaterer deres samlinger.";
  else $("tstat").textContent = `${pairs.length} ${pairs.length===1?"person":"personer"} du kan handle med. Sorteret efter hvor godt I passer begge veje.`;

  $("hub").innerHTML = pairs.map((p,i)=>{
    const mutual = p.iGet.length && p.theyGet.length;
    const stale = isStale(updatedBy[p.u.id]);
    return `<div class="hubrow" data-i="${i}">
      <span class="who">${esc(p.u.name || p.u.id)}${stale?`<span style="color:var(--lock);font-weight:400;font-size:.8rem">${staleNote(updatedBy[p.u.id])}</span>`:""}</span>
      <span class="leg">du får <b>${p.iGet.length}</b> (${money(val(p.iGet))}) · du giver <b>${p.theyGet.length}</b> (${money(val(p.theyGet))})</span>
      ${mutual?`<span class="fit">PASSER BEGGE VEJE</span>`:""}
    </div>`;
  }).join("");
  $("hub").querySelectorAll(".hubrow").forEach(r =>
    r.onclick = () => buildTrade(pairs[Number(r.dataset.i)], myBlock));
}

async function buildTrade(p, myBlock){
  const name = p.u.name || p.u.id;
  view.innerHTML = `<p class="hint">Henter ${esc(name)}s kort...</p>`;

  // Oversigten kører på det kompakte navneindeks. Først her — for én person ad
  // gangen — henter vi fulde kortdata, så vi kan vise sæt, stand og binder.
  const theirCards = await loadCards(p.u.id);
  const theirModes = modesOf(p.u.id);
  const theirBlock = new Set(p.u.notForTrade || []);
  const wantSet = new Set();
  myWants.forEach(w => { wantSet.add(w.name.toLowerCase()); wantSet.add(front(w.name)); });
  p = { ...p, iGet: theirCards.filter(c =>
    modeOf(c, theirModes) === "trade" && !theirBlock.has(cardKey(c))
    && (wantSet.has(c.name.toLowerCase()) || wantSet.has(front(c.name)))) };

  const sel = { get:new Set(p.iGet.map(cardKey)), give:new Set(p.theyGet.map(cardKey)) };

  view.innerHTML = `
    <div class="row" style="margin-bottom:14px">
      <button class="act" id="back">← Tilbage</button>
      <h2 style="font-size:1.15rem;margin:0">Handel med ${esc(name)}</h2>
    </div>
    <div class="tcols">
      <div class="tcol">
        <h3>Du får af ${esc(name)}</h3>
        <div class="sum" id="sget"></div>
        <div id="lget"></div>
      </div>
      <div class="tcol">
        <h3>${esc(name)} får af dig</h3>
        <div class="sum" id="sgive"></div>
        <div id="lgive"></div>
      </div>
    </div>
    <div class="bal">
      <span class="big" id="balance"></span>
      <button class="act primary" id="copy" style="margin-left:auto">Kopiér handel som tekst</button>
    </div>
    <div class="remind"><b>Efter handlen:</b> ${esc(REMINDER)}</div>`;

  const row = (c, side, i) => `<div class="titem${sel[side].has(cardKey(c))?"":" off"}" data-k="${esc(cardKey(c))}" data-s="${side}" data-i="${i}">
      <input type="checkbox" ${sel[side].has(cardKey(c))?"checked":""}>
      <img class="thumb" loading="lazy" src="${scryImg(c.scryfallId)}" alt="" onerror="this.style.opacity=.15">
      <span class="tn">${esc(c.name)}<div class="tm">${esc(c.set||"")} ${c.cn?"#"+esc(c.cn):""}${c.foil?" · foil":""}${c.qty>1?` · har ${c.qty}`:""}</div></span>
      <span class="tp">${c.eur!=null?money(c.eur):"—"}</span>
      ${side==="give"?`<button class="drop" title="Marker som ikke til handel">✕</button>`:""}
    </div>`;

  function draw(){
    $("lget").innerHTML  = p.iGet.length   ? p.iGet.map((c,i)=>row(c,"get",i)).join("")     : `<p class="hint">Ingen af dine wants hos ${esc(name)}.</p>`;
    $("lgive").innerHTML = p.theyGet.length? p.theyGet.map((c,i)=>row(c,"give",i)).join("") : `<p class="hint">${esc(name)} mangler ingen af dine kort.</p>`;
    const vg = p.iGet.filter(c=>sel.get.has(cardKey(c))).reduce((s,c)=>s+(c.eur||0),0);
    const vv = p.theyGet.filter(c=>sel.give.has(cardKey(c))).reduce((s,c)=>s+(c.eur||0),0);
    $("sget").textContent  = `${sel.get.size} valgt · ${money(vg)}`;
    $("sgive").textContent = `${sel.give.size} valgt · ${money(vv)}`;
    const d = vg - vv;
    $("balance").innerHTML = Math.abs(d) < 0.5
      ? `⚖️ Lige op — ${money(vg)} hver vej`
      : d > 0 ? `Du får <b style="color:var(--want)">${money(d)}</b> mere end du giver`
              : `Du giver <b style="color:var(--lock)">${money(-d)}</b> mere end du får`;
    bind();
  }

  function bind(){
    // Klik på miniaturen åbner den store visning og bladrer i den kolonne man er i.
    view.querySelectorAll(".titem .thumb").forEach(img => img.onclick = () => {
      const it = img.closest(".titem");
      const list = it.dataset.s === "get" ? p.iGet : p.theyGet;
      const i = Number(it.dataset.i);
      openCard({ ...list[i] }, list.map(x=>({...x})), i, draw);
    });
    view.querySelectorAll(".titem input").forEach(inp => inp.onchange = () => {
      const it = inp.closest(".titem"), k = it.dataset.k, s = it.dataset.s;
      inp.checked ? sel[s].add(k) : sel[s].delete(k);
      draw();
    });
    view.querySelectorAll(".titem .drop").forEach(b => b.onclick = async () => {
      const k = b.closest(".titem").dataset.k;
      myBlock.add(k); sel.give.delete(k);
      p.theyGet = p.theyGet.filter(c => cardKey(c) !== k);
      await setDoc(doc(db,"users",user.uid), { notForTrade:[...myBlock] }, { merge:true });
      if (usersById[user.uid]) usersById[user.uid].notForTrade = [...myBlock];
      toast("Markeret som ikke til handel");
      draw();
    });
  }

  $("back").onclick = () => renderTrade();
  $("copy").onclick = () => {
    const fmtList = (list, set) => list.filter(c=>set.has(cardKey(c)))
      .map(c=>`  - ${c.name}${c.set?` (${c.set}${c.cn?" #"+c.cn:""})`:""}${c.foil?" foil":""}${c.eur!=null?` - ${money(c.eur)}`:""}`).join("\n");
    const g = p.iGet.filter(c=>sel.get.has(cardKey(c))), v = p.theyGet.filter(c=>sel.give.has(cardKey(c)));
    const vg = g.reduce((s,c)=>s+(c.eur||0),0), vv = v.reduce((s,c)=>s+(c.eur||0),0), d = vg-vv;
    const txt = `Bytteforslag: ${user.displayName} <-> ${name}\n\n`
      + `Jeg får af dig (${g.length} kort, ${money(vg)}):\n${fmtList(p.iGet,sel.get)||"  -"}\n\n`
      + `Du får af mig (${v.length} kort, ${money(vv)}):\n${fmtList(p.theyGet,sel.give)||"  -"}\n\n`
      + (Math.abs(d)<0.5 ? `Lige op.\n\n` : `Forskel: ${money(Math.abs(d))} i ${d>0?"min":"din"} favør.\n\n`)
      + REMINDER;
    navigator.clipboard.writeText(txt)
      .then(()=>toast("Handel kopieret — paste den i chatten"))
      .catch(()=>{ const t=document.createElement("textarea"); t.value=txt; document.body.appendChild(t);
                   t.select(); document.execCommand("copy"); t.remove(); toast("Handel kopieret"); });
  };

  draw();
}

// ---------- Profil ----------
async function renderProfile(){
  const snap=await getDoc(doc(db,"users",user.uid));
  const d=snap.exists()?snap.data():{};
  const col=await getDoc(doc(db,"collections",user.uid));
  const raw=(col.exists()? (col.data().binders||[]) : []);
  const binders=raw.map(b=>typeof b==="string"?{name:b}:b);
  // Eksplicit valg vinder; ellers ManaBox' Binder Type; lockedBinders er v1.1-arv.
  const saved={...(d.binderMode||{})};
  for(const b of (d.lockedBinders||[])) if(!saved[b]) saved[b]="deck";
  const modeFor=b=>saved[b.name]||autoMode(b.type);

  const upd = col.exists() ? col.data().updated : null;
  const warn = !col.exists()
    ? `<div class="remind" style="max-width:520px;margin:0 0 16px"><b>Din samling er ikke synket endnu.</b>
       Indsæt dit Drive mappe-ID nedenfor, og del mappen med nat-jobbets service-konto.</div>`
    : isStale(upd)
    ? `<div class="remind" style="max-width:520px;margin:0 0 16px"><b>Din samling er ${ageInDays(upd)} dage gammel.</b>
       Nat-synket har ikke kunnet hente noget nyt. Tjek at der ligger en frisk CSV-eksport i din
       Drive-mappe, og at mappen stadig er delt med service-kontoen. De andre handler ud fra det her.</div>`
    : "";

  view.innerHTML=`${warn}<div class="field">
    <label>Visningsnavn</label><input id="pname" value="${esc(d.name||user.displayName)}" style="width:100%">
    <label>Google Drive mappe-ID (hvor dine ManaBox-eksporter ligger)</label>
    <input id="pdrive" value="${esc(d.driveFolderId||'')}" placeholder="fx 1UT8G9VJIMg4..." style="width:100%">
    <p class="hint">Del mappen med nat-jobbets service-konto (se SETUP-guiden), og indsæt mappe-ID'et
    fra Drive-URL'en her. Nat-synket henter din nyeste CSV automatisk.</p>
    <button class="act primary" id="psave" style="margin-top:16px">Gem</button>
  </div>

  <h2 style="margin:28px 0 6px;font-size:1.1rem">📦 Mine bindere</h2>
  <p class="hint" style="max-width:640px;margin-bottom:10px">
  <b>Til handel</b> — fysiske kort andre må spørge efter.<br>
  <b>Låst til deck</b> — fysiske kort du ejer, men som sidder i et deck. De vises for de andre
  med <span class="badge lockb">I DECK</span>, men filtreres fra i matches.<br>
  <b>Ikke fysisk</b> — ManaBox-lister og wishlists. De tæller hverken med i din samling eller i
  matches. Uden det ville det samme kort blive talt to gange, hvis det både står i en liste og i din samling.</p>
  <div class="field" id="blist" style="max-width:640px"></div>`;

  const bl=$("blist");
  bl.innerHTML = binders.length ? binders.map((b,i)=>{
      const m=modeFor(b);
      return `<div class="binderrow">
      <span class="nm">${esc(b.name)}${b.unique?` <span style="color:var(--muted);font-size:.8rem">· ${b.unique} kort</span>`:""}${b.type?` <span style="color:var(--muted);font-size:.75rem">(${esc(b.type)})</span>`:""}</span>
      <span class="seg" data-i="${i}">
        <button data-v="trade" class="${m==="trade"?"on":""}">Til handel</button>
        <button data-v="deck" class="lock ${m==="deck"?"on":""}">Låst til deck</button>
        <button data-v="list" class="list ${m==="list"?"on":""}">Ikke fysisk</button>
      </span></div>`;}).join("")
    : `<p class="hint">Ingen bindere fundet i din seneste ManaBox-eksport. Sørg for at eksporten
       indeholder kolonnen "Binder Name" — ellers kan alt kun behandles som ét samlet lager.</p>`;

  bl.querySelectorAll(".seg").forEach(seg => seg.querySelectorAll("button").forEach(btn => btn.onclick = async () => {
    const b = binders[Number(seg.dataset.i)];
    saved[b.name] = btn.dataset.v;
    seg.querySelectorAll("button").forEach(x=>x.classList.toggle("on", x===btn));
    await setDoc(doc(db,"users",user.uid), { binderMode: saved }, { merge:true });
    if (usersById[user.uid]) usersById[user.uid].binderMode = { ...saved };
    toast(`${b.name}: ${MODE_LABEL[btn.dataset.v].toLowerCase()}`);
  }));

  $("psave").onclick=async()=>{
    await setDoc(doc(db,"users",user.uid),{name:$("pname").value.trim(),driveFolderId:$("pdrive").value.trim()},{merge:true});
    toast("Profil gemt");
  };
}
</script>
